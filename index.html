const bin=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bin(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bin(D.i)},k,bin(D.c)))}
function open_(h){document.open();document.write(h);document.close()}
async function go(pw,silent){const b=document.getElementById('b'),e=document.getElementById('e');b.disabled=true;b.textContent='Abriendo…';e.textContent='';
 try{const h=await dec(pw);if(document.getElementById('r').checked)try{localStorage.setItem('liga-k',pw)}catch(x){}open_(h)}
 catch(x){b.disabled=false;b.textContent='Entrar';try{localStorage.removeItem('liga-k')}catch(y){}if(!silent)e.textContent=x.message==='nocrypto'?'Abrí el link desde el navegador (https).':'La clave no es correcta. Revisala e intentá de nuevo.'}}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();const v=document.getElementById('p').value.trim();if(v)go(v)});
try{const k=localStorage.getItem('liga-k');if(k)go(k,true)}catch(x){}
